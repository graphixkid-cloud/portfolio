# Deploys the Portfolio Assistant Worker (_worker/) to Cloudflare.
# Runs when _worker/ changes on main, or by hand from the Actions tab ("Run workflow").
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ANTHROPIC_API_KEY, ASSISTANT_SALT
name: Deploy Portfolio Assistant

on:
  push:
    branches: [main]
    paths: ["_worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

concurrency: deploy-worker

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _worker/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npx vitest run

      - name: Check that the secrets are set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASSISTANT_SALT: ${{ secrets.ASSISTANT_SALT }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANTHROPIC_API_KEY ASSISTANT_SALT; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Find or create the rate-limit storage (KV namespace)
        run: |
          set -euo pipefail
          title="portfolio-assistant-limits"
          find_id() { npx wrangler kv namespace list | jq -r --arg t "$title" '.[] | select(.title == $t) | .id' | head -n1; }
          id="$(find_id)"
          if [ -z "$id" ]; then
            npx wrangler kv namespace create "$title"
            id="$(find_id)"
          fi
          if [ -z "$id" ]; then echo "::error::Could not find or create the KV namespace"; exit 1; fi
          sed -i "s/__LIMITS_KV_ID__/$id/" wrangler.toml
          echo "KV namespace: $id"

      - name: Deploy (with the API key and salt as Worker secrets)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASSISTANT_SALT: ${{ secrets.ASSISTANT_SALT }}
        run: |
          set -euo pipefail
          secrets="$RUNNER_TEMP/worker-secrets.json"
          jq -n --arg k "$ANTHROPIC_API_KEY" --arg s "$ASSISTANT_SALT" '{ANTHROPIC_API_KEY: $k, SALT: $s}' > "$secrets"
          npx wrangler deploy --secrets-file "$secrets"
          rm -f "$secrets"
