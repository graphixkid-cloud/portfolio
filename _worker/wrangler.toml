# Portfolio Assistant Worker — deployed by .github/workflows/deploy-worker.yml
name = "portfolio-assistant"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
MODEL = "claude-haiku-5-5"
ALLOWED_ORIGINS = "https://rickhollandsworth.com"
DAILY_LIMIT = "450"
# Messages per visitor per hour. Raised to 100 while Rick tests; set back to "20" at launch.
VISITOR_LIMIT = "100"

# The deploy workflow finds or creates the KV namespace and fills in its ID.
[[kv_namespaces]]
binding = "LIMITS"
id = "__LIMITS_KV_ID__"

# Secrets (set by the deploy workflow from GitHub secrets, never committed):
#   ANTHROPIC_API_KEY, SALT
